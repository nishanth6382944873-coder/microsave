# ==============================================================
# MicroSave - In-Memory H2 Profile (Alternative / Offline Mode)
# Use with: java -jar target/microsave-backend-1.0.0.jar --spring.profiles.active=h2
# ==============================================================

spring.application.name=microsave

server.port=8080

spring.datasource.url=jdbc:h2:mem:microsavedb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

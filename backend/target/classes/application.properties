# ==============================================================
# MicroSave Application Configuration
# ==============================================================

# Application Name
spring.application.name=microsave

# Server Port (Default: 8080)
server.port=8080

# --------------------------------------------------------------
# MySQL Database Configuration
# --------------------------------------------------------------
# Make sure the MySQL service is running and 'microsave' database is created.
# You can set DB_PASSWORD in your environment or change 'YOUR_PASSWORD' below.
spring.datasource.url=jdbc:mysql://localhost:3306/microsave?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --------------------------------------------------------------
# Swagger / OpenAPI Documentation
# --------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
